name: veronica
description: "A calm Android companion for using your phone less and looking after yourself more."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  go_router: ^18.1.3
  path_drawing: ^1.0.1
  intl: ^0.20.3
  home_widget: ^0.10.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/OFL-Doto.txt
    - assets/fonts/OFL-Inter.txt

  fonts:
    # Variable fonts (OFL); weights are set through the `wght` axis.
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# App icon: `dart run flutter_launcher_icons` regenerates the Android
# launcher icons from assets/icon/ (adaptive + Android 13 themed icon).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/background.png
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  min_sdk_android: 21
