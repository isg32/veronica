name: veronica
description: "A calm Android companion for using your phone less and looking after yourself more."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  go_router: ^18.1.3
  path_drawing: ^1.0.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/OFL-Doto.txt
    - assets/fonts/OFL-Inter.txt

  fonts:
    # Variable fonts (OFL); weights are set through the `wght` axis.
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
